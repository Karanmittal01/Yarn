name: Android

on:
  push:
    branches: [main]
    # Website pages (privacy policy, home page) don't need an app build or release.
    paths-ignore:
      - 'docs/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Unique, ever-increasing version code per CI run: no manual version bumps needed.
      YARN_VERSION_CODE: ${{ github.run_number }}00
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Decode signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.YARN_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "YARN_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle and APKs
        env:
          YARN_KEYSTORE_PASSWORD: ${{ secrets.YARN_KEYSTORE_PASSWORD }}
          YARN_KEY_ALIAS: ${{ secrets.YARN_KEY_ALIAS }}
          YARN_KEY_PASSWORD: ${{ secrets.YARN_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease
          ./gradlew assembleRelease -PabiSplits

      - uses: actions/upload-artifact@v4
        with:
          name: yarn-${{ env.YARN_VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk

      # Publishes every main build to Play's internal testing track. Testers get it through the
      # Play Store and Yarn's in-app "update ready" prompt. Skipped until the secret is added.
      - name: Upload to Play internal testing
        if: ${{ github.ref == 'refs/heads/main' && env.PLAY_JSON != '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.yarn.messages
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          whatsNewDirectory: distribution/whatsnew
          status: completed
